on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historial completo — un secreto borrado del HEAD sigue comprometido
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analisis estatico (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      # Semgrep escanea el codigo en busca de patrones peligrosos.
      # --config auto: reglas segun el lenguaje detectado.
      # Excluimos las reglas del propio workflow de Actions (github-actions.*):
      # el aviso de "clavar a SHA" es defensa en profundidad de nivel empresa,
      # no un fallo del codigo de la app. Camino A: vigilar la app, no el estilo del YAML.
      - name: Run semgrep
        run: semgrep scan --config auto --error --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  dependencias:
    name: Dependencias (segun el stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Node ---
      - name: Detectar Node
        id: node
        run: if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.node.outputs.found == 'true'
        with:
          node-version: 22
      - name: npm audit
        if: steps.node.outputs.found == 'true'
        run: npm audit --audit-level=high

      # --- Python ---
      - name: Detectar Python
        id: py
        run: if [ -f requirements.txt ] || [ -f pyproject.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.py.outputs.found == 'true'
        with:
          python-version: '3.12'
      - name: pip-audit
        if: steps.py.outputs.found == 'true'
        run: |
          pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else pip-audit; fi

      # --- Aviso para otros stacks ---
      - name: Recordatorio otros stacks
        run: |
          for f in composer.json Gemfile go.mod Cargo.toml; do
            if [ -f "$f" ]; then
              echo "::warning::Detectado $f — este stack no tiene auditoria de dependencias en el workflow."
              echo "Anade el paso: composer audit / bundle audit / govulncheck / cargo audit."
            fi
          done
